<!doctype html>
<!-- Происхождение: основано на AISpa 1.0.2 (MIT), phases/dashboard-template.html. Изменено: этапы AI Design, референсы, темы интервью, круги превью с лайтбоксом, примеры работ, бэкапы, Figma, оснащение. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Onest:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Вид — «Графит» семейства: центрованный лист, белые карточки на светло-сером, тёмная главная карточка.
     Цвет — сигнал: графит — идёт работа, хром — ждём человека, зелёный — сдано, красный — упало.
     Без сети шрифты системные: у каждого семейства есть запас. */
  :root{
    --bg:#F4F5F6; --card:#FFFFFF; --inset:#F4F5F6; --soft:#ECEDEF; --line:#E3E4E7; --line2:#D5D7DB;
    --tx:#181A1C; --tx2:#3A3C40; --mut:#55585E; --quiet:#62666D;
    --silver:#C7C9CC; --press:#171717; --press-tx:#FFFFFF; --press-line:transparent;
    --chrome:linear-gradient(180deg,#FFFFFF 0%,#E0E2E5 40%,#A9ACB1 62%,#EEF0F2 100%);
    --page:radial-gradient(1200px 600px at 80% -10%,#FFFFFF,transparent 70%);
    --hero:linear-gradient(165deg,#202123 0%,#0E0E10 100%);
    --hero-sh:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 rgba(255,255,255,.12);
    --done:#18784E; --done-soft:#DCFCE7; --done-tx:#166534;
    --now:#1D4ED8; --now-soft:#DBEAFE; --now-tx:#1D4ED8;
    --fix:#854D0E; --fix-soft:#FEF3C7; --fix-tx:#854D0E;
    --bad:#991B1B; --bad-soft:#FEE2E2; --bad-tx:#991B1B;
    --idle:#C7C9CC; --eyeline:rgba(23,23,23,.45); --cur:#171717; --pastline:#171717;
    --sh:0 20px 60px rgba(20,20,22,.10); --sh-btn:0 10px 26px rgba(23,23,23,.22); --sh-tab:0 4px 12px rgba(20,20,22,.10);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
      --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
      --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
      --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
      --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
      --done-soft:#123523; --done-tx:#86EFAC; --now-soft:#192E50; --now-tx:#93C5FD;
      --fix-soft:#3D3217; --fix-tx:#FDE68A; --bad-soft:#431C22; --bad-tx:#FCA5A5;
      --idle:#5A5D63; --eyeline:rgba(255,255,255,.5); --cur:#383A40; --pastline:#B9BBC1;
      --sh:0 20px 60px rgba(0,0,0,.24); --sh-btn:0 10px 26px rgba(0,0,0,.35); --sh-tab:0 4px 12px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121316; --card:#202226; --inset:#121316; --soft:#303238; --line:#414349; --line2:#52545A;
    --tx:#F1F2F4; --tx2:#D5D7DB; --mut:#C1C3C8; --quiet:#9FA2A9;
    --press:#383A40; --press-tx:#FFFFFF; --press-line:#52545A;
    --page:radial-gradient(1200px 600px at 80% -10%,#25272B,transparent 70%);
    --hero-sh:0 20px 60px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);
    --done-soft:#123523; --done-tx:#86EFAC; --now-soft:#192E50; --now-tx:#93C5FD;
    --fix-soft:#3D3217; --fix-tx:#FDE68A; --bad-soft:#431C22; --bad-tx:#FCA5A5;
    --idle:#5A5D63; --eyeline:rgba(255,255,255,.5); --cur:#383A40; --pastline:#B9BBC1;
    --sh:0 20px 60px rgba(0,0,0,.24); --sh-btn:0 10px 26px rgba(0,0,0,.35); --sh-tab:0 4px 12px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--page),var(--bg);color:var(--tx);
    font:15px/1.5 'Onest',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--tx);outline-offset:3px}
  .hero:not(.ask) :focus-visible{outline-color:#fff}
  code,.mono{font-family:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .tbig,.s-time,.ev em{font-variant-numeric:tabular-nums}
  .wrap{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:28px clamp(16px,3vw,44px) 64px;display:flex;flex-direction:column;gap:22px;min-width:0}
  .wrap>*{min-width:0}
  .card{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:clamp(20px,2.4vw,30px);min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  .wt{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:var(--quiet);margin:0;line-height:1.6;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere;min-width:0}
  .wt::before{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--eyeline))}
  .whead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:13px;color:var(--quiet)}
  .bh{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
  .bsub{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--mut);max-width:80ch}

  /* ── верх ── */
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-right:auto;min-width:0}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand-link{display:flex;align-items:center;gap:14px;color:var(--tx);text-decoration:none;border-radius:12px}
  .brand h1{display:block;margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-weight:700;font-size:25px;line-height:1.1;letter-spacing:-.01em}
  .brand small{display:block;margin-bottom:3px;font-size:12px;color:var(--quiet)}
  .logo{width:50px;height:50px;flex:none;filter:drop-shadow(0 6px 12px rgba(20,20,22,.18))}
  .logo svg{display:block;width:100%;height:100%}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .vpill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .source{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);min-width:0}
  .source .sdot{width:8px;height:8px;border-radius:999px;flex:none;background:var(--silver)}
  .source.s-live .sdot{background:#1F8A5B}
  .source.s-lost .sdot,.source.s-snap .sdot{background:var(--quiet)}
  .pref{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--tx);font:600 13px 'Onest',-apple-system,sans-serif;cursor:pointer}
  .btn{height:44px;padding:0 20px;border:1px solid var(--press-line);border-radius:15px;background:var(--press);color:var(--press-tx);font:600 14px 'Onest',-apple-system,sans-serif;cursor:pointer;
    box-shadow:var(--sh-btn);display:inline-flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.96)}
  .btn.busy .arr{animation:pulse .8s linear infinite}
  /* Вкладки «Прогон / Примеры работ» — сегменты, нажатое белое с тенью. */
  .chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:15px;background:var(--soft);width:fit-content;max-width:100%}
  .chip{appearance:none;height:44px;padding:0 16px;border-radius:11px;border:0;background:transparent;color:var(--mut);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .chip span{color:var(--quiet);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--card);color:var(--tx);box-shadow:var(--sh-tab)}
  .notice{background:var(--now-soft);color:var(--now-tx);border:1px solid currentColor;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;line-height:1.5}
  .lost{max-width:calc(1280px + 2 * clamp(16px,3vw,44px));margin:0 auto;padding:16px clamp(16px,3vw,44px) 0}

  /* ── шапка состояния ── */
  .hero{--h-tx:#fff;--h-mut:rgba(255,255,255,.82);--h-line:rgba(255,255,255,.14);--h-fill:rgba(255,255,255,.06);
    --glow:radial-gradient(520px 520px at calc(100% + 140px) -100px,rgba(199,201,204,.20),transparent 70%);
    border-radius:28px;padding:clamp(20px,2.4vw,30px);display:flex;flex-direction:column;gap:24px;
    background:var(--glow),var(--hero);color:var(--h-tx);box-shadow:var(--hero-sh);min-width:0}
  .hero.ask{background:var(--glow),linear-gradient(165deg,#FFFFFF 0%,#E0E2E5 45%,#C7C9CC 100%);--h-tx:#171717;--h-mut:rgba(23,23,23,.78);--h-line:rgba(23,23,23,.14);--h-fill:rgba(23,23,23,.05);
    box-shadow:0 40px 90px rgba(20,20,22,.16),inset 0 1px 0 #fff}
  .hero.won{background:var(--glow),linear-gradient(165deg,#18784E 0%,#10593A 100%);--h-mut:rgba(255,255,255,.9);--h-line:rgba(255,255,255,.2)}
  .hero.bad{background:var(--glow),linear-gradient(165deg,#A82121 0%,#851717 100%);--h-line:rgba(255,255,255,.2)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 20px}
  .hwt{margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--h-mut);
    display:flex;align-items:center;gap:10px;line-height:1.6;min-width:0;overflow-wrap:anywhere;flex:1 1 260px}
  .hwt::before{content:"";flex:0 0 26px;height:1px;background:linear-gradient(90deg,transparent,var(--h-mut))}
  .state{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;background:var(--h-fill);border:1px solid var(--h-line);font-size:13px;font-weight:600}
  .hero h2{font-family:'Unbounded','Onest',-apple-system,sans-serif;margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.02em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16px;line-height:1.55;color:var(--h-mut);max-width:64ch}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 20px;border-radius:15px;background:#171717;color:#fff;font-size:14px;font-weight:600}
  .facts{display:flex;flex-wrap:wrap;gap:10px 32px;font-size:12px;color:var(--h-mut);margin:0}
  .facts div{display:grid;gap:3px;min-width:0}
  .facts dd{margin:0;font-size:13px;font-weight:600;color:var(--h-tx);overflow-wrap:anywhere}
  .runctx{border-top:1px solid var(--h-line);padding-top:6px;margin-top:-10px}
  .runctx>summary{display:flex;align-items:center;gap:6px;width:fit-content;min-height:32px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--h-mut)}
  .runctx>summary::-webkit-details-marker{display:none}
  .runctx>summary::before{content:'▸'}
  .runctx[open]>summary::before{content:'▾'}
  .rkv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 18px;margin:8px 0 2px;font-size:13px}
  .rkv dt{color:var(--h-mut)}
  .rkv dd{margin:0;overflow-wrap:anywhere}
  .live{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#171717}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .badge-ic{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .hero.won .badge-ic{color:#18784E}.hero.bad .badge-ic{color:#991B1B}

  /* ── этапы и время ── */
  .rowh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:12px}
  .sh{margin:0;font-family:'Unbounded','Onest',-apple-system,sans-serif;font-weight:600;font-size:17px}
  .rowh>span{font-size:13px;color:var(--quiet)}
  .stgc{padding:16px 20px;border-radius:24px}
  .stgs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .stg{display:flex;flex-direction:column;gap:6px;padding:8px 10px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--quiet);min-width:0}
  .stg>i{display:block;height:2px;border-radius:999px;background:var(--line)}
  .stg small{font-family:'Unbounded','Onest',sans-serif;font-size:11px;opacity:.75}
  .stg b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
  .stg.past{background:var(--inset);color:var(--tx)}
  .stg.past>i{background:var(--pastline)}
  .stg.cur{background:var(--cur);color:#fff;border-color:var(--cur)}
  .stg.cur>i{background:linear-gradient(90deg,#9A9DA2,#FFFFFF,#9A9DA2) 0 0/200% 100%;animation:chromeShine 2.4s linear infinite}
  .stg.fail{background:var(--bad-soft);color:var(--bad-tx);border-color:currentColor}
  .stg.skip{border-style:dashed}
  @keyframes chromeShine{from{background-position:200% 0}to{background-position:-200% 0}}
  .s-time{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;opacity:.8}
  .timec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;padding:20px clamp(20px,2.4vw,30px)}
  .tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .tcol+.tcol{border-left:1px solid var(--line);padding-left:28px}
  .tlb{font-size:12.5px;color:var(--mut)}
  .tbig{font-family:'Unbounded','Onest',-apple-system,sans-serif;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
  .tbig.dim{font-family:'Onest',-apple-system,sans-serif;font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
  .tnote{font-size:12.5px;line-height:1.5;color:var(--quiet);max-width:62ch}
  .tnote.paused{font-weight:600;color:var(--fix-tx)}

  /* ── превью: уменьшенные живые страницы ── */
  .pvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:20px}
  .pv{display:flex;flex-direction:column;gap:10px;min-width:0}
  .pvbtn{appearance:none;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--inset);cursor:zoom-in;overflow:hidden;position:relative;font:inherit;color:inherit;text-align:left;transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
  .pvbtn:hover{transform:translateY(-3px);box-shadow:var(--sh)}
  .pv.chosen .pvbtn{border:2px solid var(--done)}
  .frame{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#fff}
  .frame iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;opacity:0}
  .frame.live iframe{opacity:1}
  .frame .ph{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:13px;color:var(--mut);background:var(--inset)}
  .frame.fail .ph{color:var(--tx2);font-weight:600;line-height:1.45}
  /* Снимок превью (shots.py): виден в любом браузере, даже там, где живую страницу в рамку не пускают. */
  .frame img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .pvopen{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:13.5px;font-weight:600;color:var(--now-tx);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
  .mini .pvopen{font-size:12px;min-height:24px}
  .pvid{position:absolute;left:10px;top:10px;z-index:2;width:30px;height:30px;border-radius:999px;background:var(--chrome);color:#171717;display:grid;place-items:center;
    font-family:'Unbounded','Onest',sans-serif;font-weight:700;font-size:13px;box-shadow:0 4px 10px rgba(20,20,22,.18)}
  .zoom{position:absolute;right:10px;top:10px;z-index:2;padding:4px 10px;border-radius:999px;background:rgba(23,23,23,.78);color:#fff;font-size:12px;font-weight:600}
  .pv h4{margin:0;font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .pv p{margin:0;font-size:13.5px;line-height:1.5;color:var(--mut);overflow-wrap:anywhere}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;border:1px solid currentColor;align-self:flex-start}
  .p-done{background:var(--done-soft);color:var(--done-tx)}
  .p-now{background:var(--now-soft);color:var(--now-tx)}
  .p-mut{background:var(--card);color:var(--mut);border-color:var(--line2)}
  .p-fix{background:var(--fix-soft);color:var(--fix-tx)}
  .quote{margin:18px 0 0;padding:14px 16px;border-radius:14px;background:var(--inset);border-left:3px solid var(--tx);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
  .quote small{display:block;font-size:12.5px;color:var(--quiet);margin-bottom:4px}
  /* История кругов: маленькие превью в ряд. */
  .rnd{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .rnd:first-of-type{border-top:0;padding-top:0}
  .rnd-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
  .rnd-h b{font-size:15px}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:640px}
  .mini .pvbtn{border-radius:12px}
  .mini .pvid{width:24px;height:24px;font-size:11px;left:6px;top:6px}
  .mini .zoom{display:none}
  .rnd .quote{margin-top:0}

  /* ── референсы, темы, направление, проверка, лента ── */
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px}
  .ref{display:flex;flex-direction:column;gap:8px;min-width:0}
  .ref .thumb{appearance:none;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--inset);cursor:zoom-in;display:block;width:100%}
  .ref img{display:block;width:100%;height:100%;object-fit:cover}
  .ref .box{border:1px solid var(--line);border-radius:14px;aspect-ratio:4/3;background:var(--inset);padding:12px;display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:13px;overflow:hidden;overflow-wrap:anywhere}
  .ref .box a{color:var(--now-tx);font-weight:600}
  .ref p{margin:0;font-size:13px;line-height:1.45;color:var(--mut);overflow-wrap:anywhere}
  .ref span.mono{font-size:11.5px;color:var(--quiet)}
  .tlist{display:flex;flex-direction:column}
  .trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
  .trow:first-child{border-top:0;padding-top:0}
  .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;align-items:start}
  .pair>*{min-width:0}

let CUR = I18N.ru;
let pollT = null, pulling = false, misses = 0, lastStamp = null, booted = false;
const UI = {tab: 'run', open: {}};
const SERVED = /^https?:$/.test(location.protocol);

/*TIME-BEGIN*/
// Время работы, а не календарь: промежуток между соседними метками длиннее порога —
// простой; ожидание ответа человека (waits, waiting) вычитается целиком.
const IDLE_CAP_MS = 2700000;
let MARKS = [];
let WAITS = [];
const toMs = v => { const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
const spanMs = (from, to) => {
  const a = toMs(from);
  if (a == null) return null;
  const b = to ? toMs(to) : Date.now();
  return Math.max(0, (b == null ? Date.now() : b) - a);
};
function rememberBeats(S){
  const key = 'aidesign-beats:' + (S.slug || '') + ':' + (S.startedAt || '');
  try {
    const seen = JSON.parse(localStorage.getItem(key) || '[]');
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1) {
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = toMs(v); if (t != null) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  (S.beats || []).forEach(push);
  rememberBeats(S).forEach(push);
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.waits || []).forEach(x => { push(x.from); push(x.to); });
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
function collectWaits(S){
  const out = [];
  (S.waits || []).forEach(w => {
    const a = toMs(w.from), b = toMs(w.to);
    if (a != null && b != null && b > a) out.push([a, b]);
  });
  if (S.waiting && !S.finishedAt) {
    const a = toMs(S.waiting.since);
    if (a != null) out.push([a, null]);
  }
  return out;
}
function waitedIn(a, b){
  let s = 0;
  WAITS.forEach(([x, y]) => {
    const hi = Math.min(b, y == null ? Date.now() : y), lo = Math.max(a, x);
    if (hi > lo) s += hi - lo;
  });
  return s;
}
function activeMs(from, to){
  const a = toMs(from);
  if (a == null) return null;
  const b = (to && toMs(to)) || Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const gap = pts[i] - pts[i-1] - waitedIn(pts[i-1], pts[i]);
    s += Math.min(Math.max(0, gap), IDLE_CAP_MS);
  }
  return s;
}
/*TIME-END*/

function idleNow(){
  const S = window.STATE || {};
  if (!S || S.finishedAt || S.waiting) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;
}
const fmtClock = ms => {
  if (ms == null) return '—';
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
const hhmm = iso => { const t = toMs(iso); if (t == null) return ''; const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
function timerHTML(from, to){
  const ms = activeMs(from, to);
  if (ms == null) return '—';
  return to ? fmtClock(ms) : `<span data-live data-from="${esc(from)}">${fmtClock(ms)}</span>`;
}
function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '—';
  const s = Math.floor(ms/1000);
  if (s < 60) return CUR.ago.s(s);
  const m = Math.floor(s/60);
  return m < 60 ? CUR.ago.m(m) : CUR.ago.h(Math.floor(m/60), m%60);
}
function agoShort(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '';
  const m = Math.floor(ms/60000);
  return m < 1 ? CUR.agoShort.s : m < 60 ? CUR.agoShort.m(m) : CUR.agoShort.h(Math.floor(m/60));
}
function tick(){
  const stopped = idleNow();
  document.querySelectorAll('[data-live][data-from]').forEach(el => { el.textContent = fmtClock(activeMs(el.dataset.from, null)); });
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = fmtClock(spanMs(el.dataset.since, null)); });
  document.querySelectorAll('[data-idle-note]').forEach(el => { el.hidden = !stopped; });
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    const S = window.STATE || {};
    el.classList.toggle('stale', !S.finishedAt && !S.waiting && (spanMs(el.dataset.ago, null) || 0) > 300000);
  });
  document.querySelectorAll('[data-ago-short]').forEach(el => { el.textContent = agoShort(el.dataset.agoShort); });
}

// ——— автообновление: state.js подгружается отдельным тегом, без перезагрузки ———
const stampOf = S => (S.rev || '') + '|' + (S.updatedAt || '') + '|' + (S.finishedAt || '');
function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== 'object') return;
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  try { render(CUR.lang); } catch (e) { lastStamp = ''; bootFail(esc(String(e && e.message || e))); }
  window.scrollTo(0, y);
}
function showLink(){
  const el = document.getElementById('link');
  if (!el) return;
  const lost = SERVED && misses >= 2 && !(window.STATE && window.STATE.finishedAt);
  el.hidden = !lost;
  el.parentNode.hidden = !lost;
  if (lost) el.textContent = CUR.lost;
  const k = sourceKind();
  document.querySelectorAll('[data-source]').forEach(s => {
    s.className = 'source s-' + k;
    const t = s.querySelector('[data-source-label]');
    if (t) t.textContent = CUR.src[k];
  });
}
function sourceKind(){
  const fin = window.STATE && window.STATE.finishedAt;
  if (SERVED) return misses >= 2 && !fin ? 'lost' : 'live';
  if (location.protocol === 'file:') return misses >= 2 ? 'snap' : 'file';
  return 'snap';
}
function pullState(done){
  if (pulling) return;
  pulling = true;
  const s = document.createElement('script');
  s.src = 'state.js?t=' + Date.now();
  const end = ok => {
    s.remove();
    pulling = false;
    misses = ok ? 0 : misses + 1;
    if (ok) applyState();
    showLink();
    if (done) done(ok);
  };
  s.onload = () => end(true);
  s.onerror = () => end(false);
  document.head.appendChild(s);
}
function pollState(){
  clearTimeout(pollT);
  if (window.STATE && window.STATE.finishedAt) return;
  pollT = setTimeout(() => pullState(pollState), POLL_MS);
}
function refreshNow(btn){
  clearTimeout(pollT);
  if (btn) btn.classList.add('busy');
  const started = Date.now();
  pullState(ok => {
    if (!ok && btn) misses = Math.max(misses, 2);
    showLink();
    setTimeout(() => document.querySelectorAll('[data-refresh]').forEach(b => b.classList.remove('busy')),
      Math.max(0, 500 - (Date.now() - started)));
    pollState();
  });
}

// ——— превью: адреса и уменьшенные живые страницы ———
// Превью лежат в папке прогона: панель грузит их через тот же сервер как <dir>/<src>.
const runUrl = (S, p) => {
  const s = String(p || '');
  if (/^(https?:)?\/\//i.test(s) || s.startsWith('/')) return s;
  return (S.dir ? S.dir.split('/').map(encodeURIComponent).join('/') + '/' : '') + s.split('/').map(encodeURIComponent).join('/');
};
// Карточка-превью: кнопка увеличения. Есть снимок (shots.py) — внутри он: его покажет любой браузер.
// Нет — живой iframe 1280×800, уменьшенный под ширину карточки; он проявляется, только когда точно
// загрузился, а не пустил браузер — на его месте строка, что делать. Под карточкой — ссылка на сам HTML.
// У рамки нет loading="lazy": отложенная рамка пишет в Resource Timing статус 0 и при удачной загрузке.
function pvButton(item, key, idx, label){
  const failed = item.src && SERVED && !item.shot ? FRAMES[absUrl(item.src)] : null;
  const inner = !item.src ? `<div class="ph">${esc(CUR.optWait)}</div>`
    : !SERVED ? `<div class="ph">${esc(CUR.noFile)}</div>${item.shot ? `<img class="shot" src="${esc(item.shot)}" alt="" data-shot>` : ''}`
    : item.shot ? `<div class="ph">${esc(CUR.pvLoading)}</div><img class="shot" src="${esc(item.shot)}" alt="" loading="lazy" data-shot>`
    : failed ? `<div class="ph">${esc(failed === 'missing' ? CUR.lbMissing : CUR.pvBlocked)}</div>`
    : `<div class="ph">${esc(CUR.pvLoading)}</div><iframe src="${esc(item.src)}" title="${esc(item.title || '')}" tabindex="-1" aria-hidden="true" sandbox="allow-scripts" data-watch></iframe>`;
  return `<button type="button" class="pvbtn" data-lb="${esc(key)}" data-i="${idx}" aria-label="${esc(CUR.zoom + ': ' + (label ? label + ' — ' : '') + (item.title || ''))}">
    <div class="frame${failed ? ' fail' : ''}" data-fit>${inner}</div>${label ? `<span class="pvid" aria-hidden="true">${esc(label)}</span>` : ''}<span class="zoom" aria-hidden="true">${esc(CUR.zoom)}</span></button>`;
}
const pvOpen = item => item.src && SERVED ? openLink(item.src, `${esc(CUR.openTab)} <span aria-hidden="true">↗</span>`, 'pvopen') : '';
function fitFrames(){
  document.querySelectorAll('#app [data-fit]').forEach(box => {
    const f = box.querySelector('iframe');
    if (f && box.clientWidth) f.style.transform = `scale(${box.clientWidth / BASE_W})`;
  });
}
// Наборы для лайтбокса: ключ → список {src, title, note, label, img}. Собираются в render().
let SETS = {};

function render(lang){
  const L = I18N[lang] || I18N.ru;
  CUR = L;
  const S = STATE;
  MARKS = collectMarks(S);
  WAITS = collectWaits(S);
  SETS = {};
  const fin = !!S.finishedAt;
  const waiting = !fin && S.waiting ? S.waiting : null;
  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:'pending'});
  const stName = s => L.stages[s.id] || s.id;
  const activeStage = stages.find(s => s.status === 'active');
  const failedStage = stages.find(s => s.status === 'failed');
  const locale = L.lang === 'en' ? 'en-GB' : 'ru-RU';
  const stamp = iso => { const t = toMs(iso); return t == null ? '—'
    : new Date(t).toLocaleString(locale, {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); };

  // ——— шапка ———
  let heroCls = '', stateLine, h2, lead = '', hint = '';
  if (fin) {
    heroCls = 'won';
    stateLine = `<span class="badge-ic">${ic('check','xs')}</span>${L.doneState}`;
    h2 = esc(S.result || L.doneDefault);
    lead = L.doneLead;
  } else if (waiting) {
    heroCls = 'ask';
    stateLine = `<span class="live" aria-hidden="true"></span>${L.waitState}`;
    h2 = L.waitH2[waiting.kind] || L.waitState;
    lead = waiting.note ? esc(waiting.note) : '';
    hint = `<span class="hint">${ic('msg','m')}${L.waitHint}</span>`;
  } else if (failedStage) {
    heroCls = 'bad';
    stateLine = `<span class="badge-ic">${ic('x','xs')}</span>${L.failState}`;
    h2 = L.failH2(stName(failedStage));
    lead = esc(failedStage.note || '');
  } else {
    const cur = activeStage || stages.find(s => s.status === 'pending') || stages[stages.length - 1];
    stateLine = `<span class="live" aria-hidden="true"></span>${L.stateRun[cur.id] || stName(cur)}`;
    h2 = L.h2Run[cur.id] || stName(cur);
    lead = cur.note ? esc(cur.note) : (L.leadRun[cur.id] || '');
  }
  const curStage = activeStage || failedStage || (fin ? null : stages.find(s => s.status === 'pending'));
  const facts = [
    [L.fUpdated, S.updatedAt ? stamp(S.updatedAt) : '—'],
    [L.fStage, fin ? L.doneState : curStage ? esc(stName(curStage)) : '—'],
    S.mode ? [L.fMode, esc(L.modes[S.mode] || S.mode)] : null,
    S.entry ? [L.fEntry, esc(L.entries[S.entry] || S.entry)] : null,
    S.questions ? [L.fQuestions, esc(L.questions[S.questions] || S.questions)] : null,
  ].filter(Boolean).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const runRows = [
    S.startedAt ? [L.rStarted, esc(stamp(S.startedAt))] : null,
    S.finishedAt ? [L.rFinished, esc(stamp(S.finishedAt))] : null,
    (S.dir || S.slug) ? [L.rDir, `<code>.aidesign-work/${esc(S.dir || S.slug)}/</code>`] : null,
    S.skillVersion ? [L.rSkill, esc(S.skillVersion)] : null,
  ].filter(Boolean);
  const hero = `<section class="hero ${heroCls} w" aria-live="polite">
    <div class="hero-top"><p class="hwt">AI Design · ${esc(S.title || '')}</p><div class="state">${stateLine}</div></div>
    <div><h2>${h2}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${hint}</div>
    <dl class="facts">${facts}</dl>
    ${runRows.length ? `<details class="runctx" data-key="run"${UI.open.run ? ' open' : ''}><summary>${L.runData}</summary>
      <dl class="rkv">${runRows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></details>` : ''}
  </section>`;

  // ——— этапы; строка «Оснащение» — итог setup.py doctor на Подготовке ———
  const TK = toolkitParts(S.toolkit);
  const tkLine = TK ? `<p class="muted" style="margin-top:12px"><b>${L.tkHead}:</b> ${[
      TK.missing.length ? `${L.tkMissing} — ${esc(TK.missing.join(', '))}` : '',
      TK.installed.length ? `${L.tkInstalled} — ${esc(TK.installed.join(', '))}` : '',
      TK.skipped.length ? `${L.tkSkipped} — ${esc(TK.skipped.join(', '))}` : ''].filter(Boolean).join(' · ') || L.tkOk}</p>` : '';
  const idx = fin ? stages.length - 1 : Math.max(0, stages.indexOf(curStage));
  const stageCard = `<section class="card stgc w"><div class="rowh"><h3 class="sh">${L.stageHead}</h3>

    <div class="stgs" role="list">${stages.map((s, i) => {
      let cls = '', time = '';
      if (s.status === 'done') { cls = 'past'; time = s.startedAt ? timerHTML(s.startedAt, s.finishedAt) : ''; }
      else if (s.status === 'active') { cls = 'cur'; time = waiting ? L.waitingSt : (s.startedAt ? timerHTML(s.startedAt, null) : ''); }
      else if (s.status === 'failed') { cls = 'fail'; time = L.failedSt; }
      else if (s.status === 'skipped') { cls = 'skip'; time = L.skipped; }
      return `<div class="stg ${cls}" role="listitem"><i></i><div><small>${String(i + 1).padStart(2, '0')}</small><b>${esc(stName(s))}</b></div>${
        time ? `<span class="s-time">${time}</span>` : ''}</div>`;
    }).join('')}</div>${tkLine}</section>`;

  // ——— время ———
  let rLbl = '', rVal = '', rNote = '';
  if (fin) { rLbl = L.finishedAt; rVal = `<b class="tbig">${esc(stamp(S.finishedAt))}</b>`; }
  else if (waiting) { rLbl = L.waitBig; rVal = `<b class="tbig"><span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span></b>`; rNote = L.waitNote; }
  else if (activeStage && activeStage.startedAt) { rLbl = L.stageTime(stName(activeStage)); rVal = `<b class="tbig">${timerHTML(activeStage.startedAt, null)}</b>`; }
  const timeCard = `<section class="card timec w">
    <div class="tcol"><span class="tlb">${L.runTime}</span><b class="tbig">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '—'}</b>
      <span class="tnote paused" data-idle-note hidden>${L.paused}</span></div>
    ${rLbl ? `<div class="tcol"><span class="tlb">${rLbl}</span>${rVal}${rNote ? `<span class="tnote">${rNote}</span>` : ''}</div>` : ''}
  </section>`;

  // ——— круги превью ———
  const rounds = Array.isArray(S.rounds) ? S.rounds : [];
  const optItems = r => (r.options || []).map(o => ({src: o.src ? runUrl(S, o.src) : '', title: o.title, note: o.note,
    shot: o.shot1280 ? runUrl(S, o.shot1280) : '', shotPhone: o.shot390 ? runUrl(S, o.shot390) : '',
    label: String(o.id || '').toUpperCase(), sub: L.round(r.n)}));
  const choicePill = r => r.chosen === 'none' ? `<span class="pill p-fix">${L.none}</span>`
    : r.chosen ? `<span class="pill p-done">${ic('check','xs')}${L.chosen}: ${esc(String(r.chosen).toUpperCase())}</span>` : '';
  const cr = rounds[rounds.length - 1];
  let roundCard;
  if (cr) {
    const items = optItems(cr), key = 'r' + cr.n;
    SETS[key] = items;
    const slots = ['a','b','c'].map(id => (cr.options || []).find(o => o.id === id) ? null : id)
      .filter(Boolean).filter(() => !cr.refinedFrom);
    roundCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.roundHead}</h3>${choicePill(cr)}</div>
      <h3 class="bh">${L.round(cr.n)}</h3><p class="bsub">${cr.refinedFrom ? esc(L.refineOf(cr.refinedFrom.round, String(cr.refinedFrom.id || ''))) + '. ' : ''}${L.roundSub}</p>
      <div class="pvgrid">${(cr.options || []).map((o, i) => `<div class="pv${cr.chosen === o.id ? ' chosen' : ''}">${pvButton(items[i], key, i, items[i].label)}
        <h4>${esc(o.title || '')}</h4>${o.note ? `<p>${esc(o.note)}</p>` : ''}${pvOpen(items[i])}</div>`).join('')}${
        slots.map(id => `<div class="pv"><div class="pvbtn" style="cursor:default"><div class="frame"><div class="ph">${esc(id.toUpperCase())} · ${L.optWait}</div></div></div></div>`).join('')}</div>
      ${cr.feedback ? `<p class="quote"><small>${L.feedback}</small>${esc(cr.feedback)}</p>` : ''}</section>`;
  } else {
    roundCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.roundHead}</h3></div>

  }
  const past = rounds.slice(0, -1).reverse();
  const historyCard = past.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.historyHead}</h3><span>${L.historySub(past.length)}</span></div>
    ${past.map(r => { const items = optItems(r), key = 'r' + r.n; SETS[key] = items;
      return `<div class="rnd"><div class="rnd-h"><b>${L.round(r.n)}${r.refinedFrom ? ` · <span class="muted">${esc(L.refineOf(r.refinedFrom.round, String(r.refinedFrom.id || '')))}</span>` : ''}</b>${
        choicePill(r) || `<span class="pill p-mut">${L.noChoice}</span>`}</div>
        <div class="mini">${(r.options || []).map((o, i) => `<div class="pv${r.chosen === o.id ? ' chosen' : ''}">${pvButton(items[i], key, i, items[i].label)}${pvOpen(items[i])}</div>`).join('')}</div>
        ${r.feedback ? `<p class="quote"><small>${L.feedback}</small>${esc(r.feedback)}</p>` : ''}</div>`; }).join('')}</section>` : '';

  // ——— референсы ———
  const refs = Array.isArray(S.refs) ? S.refs : [];
  const refImgs = [];
  const refCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.refsHead}</h3>${refs.length ? `<span>${refs.length}</span>` : ''}</div>
    ${refs.length ? `<div class="refs">${refs.map((r, i) => {
      const n = `<span class="mono">${i + 1} · ${esc(L.kinds[r.kind] || r.kind)}</span>`;
      const note = r.note ? `<p>${esc(r.note)}</p>` : '';
      if ((r.kind === 'image' || r.kind === 'screenshot') && SERVED && r.path && !/^\//.test(r.path)) {
        const src = runUrl(S, r.path), j = refImgs.length;
        refImgs.push({src, img: true, title: r.note || r.path, label: String(i + 1), sub: L.refsHead});
        return `<div class="ref"><button type="button" class="thumb" data-lb="refs" data-i="${j}" aria-label="${esc(CUR.zoom + ': ' + (r.note || r.path))}"><img src="${esc(src)}" alt="${esc(r.note || '')}" loading="lazy"></button>${n}${note}</div>`;
      }
      if (r.kind === 'url' && httpHref(r.path)) {
        let host = r.path; try { host = new URL(r.path).host; } catch(e) {}
        return `<div class="ref"><div class="box">${ic('eye')}<a href="${esc(httpHref(r.path))}" target="_blank" rel="noopener noreferrer">${esc(host)}</a></div>${n}${note}</div>`;
      }
      return `<div class="ref"><div class="box">${r.kind === 'text' ? '' : ic('image')}<span>${esc(r.path || '')}</span></div>${n}${note}</div>`;
    }).join('')}</div>` : `<div class="empty">${ic('image','m')}<span>${L.refsEmpty}</span></div>`}</section>`;
  SETS.refs = refImgs;

  // ——— темы интервью ———
  const themes = Array.isArray(S.themes) ? S.themes : [];
  const TP = {wait:'p-mut', asked:'p-now', answered:'p-done', decided:'p-done'};
  const decided = themes.filter(themeDone).length;
  const themesCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.themesHead}</h3>${themes.length ? `<span>${L.themesOf(decided, themes.length)}</span>` : ''}</div>
    ${themes.length ? `<div class="tlist">${themes.map(t => `<div class="trow"><span>${esc(t.title || t.id)}</span><span class="pill ${TP[t.status] || 'p-mut'}">${
      themeDone(t) ? ic('check','xs') : ''}${esc(L.ts[t.status] || t.status)}</span></div>`).join('')}</div>` : `<p class="muted">${L.themesEmpty}</p>`}</section>`;

  // ——— направление и проверка ———
  const D = S.direction;
  const F = S.figma && httpHref(S.figma.url) ? S.figma : null;
  const figmaLine = F ? `<p class="muted" style="margin-top:10px">${L.figmaHead}: <a href="${esc(httpHref(S.figma.url))}" target="_blank" rel="noopener noreferrer">${
    esc(L.figmaModes[F.mode] || F.mode || '')}</a></p>` : '';
  const dirCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.dirHead}</h3></div>${D
    ? `<p class="dir">${esc(D.name)}</p><p class="muted">${esc(D.summary || '')}</p>${D.file ? `<p class="muted" style="margin-top:10px">${L.dirFile} <code>${esc(D.file)}</code></p>` : ''}`
    : `<p class="muted">${L.dirEmpty}</p>`}${figmaLine}</section>`;
  const C = S.check;
  const left = C ? Math.max(0, (+C.findings || 0) - (+C.fixed || 0)) : 0;
  const checkCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.checkHead}</h3>${C ? `<span class="pill ${left ? 'p-fix' : 'p-done'}">${left ? L.checkLeft(left) : ic('check','xs') + ' ' + esc(L.checkVal(0, 0))}</span>` : ''}</div>${C
    ? `<p class="big">${esc(C.fixed)}<small>${L.of} ${esc(C.findings)}</small></p><p class="muted" style="margin-top:10px">${esc(L.checkVal(+C.findings || 0, +C.fixed || 0))}</p>`
    : `<p class="muted">${L.checkEmpty}</p>`}</section>`;

  const backupsCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.bkHead}</h3>${backups.length ? `<span>${backups.length}</span>` : ''}</div>${
    backups.length ? `<ol class="nl">${backups.slice().reverse().map(b => `<li><b>${esc(b.reason || '')}</b> · ${esc(fmtBytes(b.bytes))}${
      b.at ? ' · ' + esc(stamp(b.at)) : ''}<br><span class="muted">${L.bkRestore}:</span> <code>${esc(restoreCmd(b.id))}</code></li>`).join('')}</ol>
    <p class="muted" style="margin-top:10px">${L.bkNote}</p>` : `<p class="muted">${L.bkEmpty}</p>`}</section>`;
  // ——— медиа: источник, подключённые генераторы, «потрачено X из N» по сервисам ———
  const MS = mediaSums(S.media), MD = S.media || {};
  const conn = Array.isArray(MD.connected) ? MD.connected.filter(Boolean) : [];
  const mediaCard = MS ? `<section class="card w"><div class="whead"><h3 class="wt">${L.mdHead}</h3>${MS.limit != null
      ? `<span class="pill ${MS.over ? 'p-fix' : 'p-done'}">${esc(L.mdSpent(MS.total, MS.limit, MS.unit))}</span>` : ''}</div>
    <p class="muted">${L.mdSource}: <b>${esc(MD.sources ? (L.mdSources[MD.sources] || MD.sources) : L.mdSourceNone)}</b></p>
    <p class="muted" style="margin-top:8px">${L.mdConnected}: ${conn.length ? conn.map(c => `<b>${esc(c.title || c.id)}</b>${
      Array.isArray(c.kinds) && c.kinds.length ? ' · ' + esc(c.kinds.map(k => L.mdKinds[k] || k).join(', ')) : ''}`).join('; ') : esc(L.mdNone)}</p>
    ${MS.by.length ? `<ol class="nl">${MS.by.map(([s, a]) => `<li><b>${esc(s)}</b> · ${esc(a)} ${esc(MS.unit)}</li>`).join('')}</ol>` : ''}
    ${MS.limit == null ? `<p class="muted" style="margin-top:10px">${L.mdNoBudget}</p>` : MS.over ? `<p class="muted" style="margin-top:10px">${L.mdOver}</p>` : ''}</section>` : '';
  const report = S.report || [], asm = S.assumptions || [];
  const notesCard = (report.length || asm.length) ? `<section class="card w">
    ${asm.length ? `<div class="whead"><h3 class="wt">${L.assumptionsHead}</h3><span>${asm.length}</span></div><ol class="nl">${asm.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
    ${report.length ? `<div class="whead" style="margin-top:${asm.length ? 18 : 0}px"><h3 class="wt">${L.reportHead}</h3><span>${report.length}</span></div><ol class="nl">${report.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
  </section>` : '';

  // ——— лента ———
  const evText = e => {

    if (e.k === 'stage') return (V.stage[e.act] || V.stage.start)(L.stages[e.id] || e.id, e.note);
    if (typeof V[e.k] === 'function') return V[e.k](e);

  };
  const evTone = e => e.k === 'finish' ? ['f-done','flag'] : e.k === 'ask' ? ['f-now','msg'] : e.k === 'answered' ? ['','msg']
    : e.k === 'stage' ? ({done:['f-done','check'], fail:['f-bad','x'], skip:['','chev']}[e.act] || ['','play'])
    : e.k === 'round' ? (e.act === 'choose' ? ['f-done','check'] : ['','eye']) : e.k === 'ref' ? ['','image']
    : e.k === 'check' ? [e.findings > e.fixed ? 'f-now' : 'f-done', 'check'] : ['','plus'];
  const feedRows = (S.log || []).slice().reverse().map(e => {
    let text = null;
    try { text = evText(e); } catch (err) { text = null; }
    if (!text) return '';
    const [cls, icon] = evTone(e);
    return `<div class="ev"><span class="ei ${cls}">${ic(icon,'xs')}</span><span>${esc(text)}</span>${
      fin ? `<em>${hhmm(e.t)}</em>` : `<em data-ago-short="${esc(e.t)}">${agoShort(e.t)}</em>`}</div>`;
  }).filter(Boolean);
  const histCard = feedRows.length ? `<details class="card hist w" data-key="hist"${UI.open.hist ? ' open' : ''}>
    <summary><h3>${L.feed}</h3><span>${feedRows.length}</span></summary><div>${feedRows.join('')}</div></details>` : '';

  // ——— раскладка ———
  const theme = storedTheme() || 'system';
  const opt = (v, t, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${t}</option>`;
  const tabs = `<div class="chips" role="group" aria-label="${L.tabRun} / ${L.tabExamples}">
    <button type="button" class="chip" data-tab="run" aria-pressed="${UI.tab === 'run'}">${L.tabRun}</button>
    <button type="button" class="chip" data-tab="examples" aria-pressed="${UI.tab === 'examples'}">${L.tabExamples}</button></div>`;
  const fileNote = SERVED ? '' : `<div class="notice" role="status">${L.fileMode}</div>`;
  const runBody = [hero, stageCard, timeCard, roundCard, historyCard,
    `<div class="pair">${refCard}${themesCard}</div>`, `<div class="pair">${dirCard}${checkCard}</div>`, mediaCard, backupsCard, notesCard, histCard];
  const app = document.getElementById('app');
  document.documentElement.lang = L.lang;
  const t0 = nowMs();
  app.innerHTML = `
  <header class="top">
    <div class="brand-row">${BRAND(L.workshopLink)}${S.skillVersion ? `<span class="vpill">${esc(S.skillVersion)}</span>` : ''}</div>
    <div class="tools">
      <div class="source" data-source><span class="sdot" aria-hidden="true"></span><span data-source-label></span></div>
      <label><span class="sr-only">${L.langLabel}</span><select class="pref" data-pref="lang" aria-label="${L.langLabel}">${opt('ru', 'RU', L.lang)}${opt('en', 'EN', L.lang)}</select></label>
      <label><span class="sr-only">${L.themeLabel}</span><select class="pref" data-pref="theme" aria-label="${L.themeLabel}">${
        opt('system', L.themeSystem, theme)}${opt('light', L.themeLight, theme)}${opt('dark', L.themeDark, theme)}</select></label>
      <button type="button" class="btn" data-refresh><span>${L.refresh}</span> <span class="arr" aria-hidden="true">→</span></button>
    </div>
  </header>
  ${fileNote}
  ${tabs}
  ${UI.tab === 'examples' ? examplesCard(L) : runBody.filter(Boolean).join('\n')}
  <footer>
    <span>${L.footer}</span>
    <span>${fin ? L.frozen : `${L.updated}: <span data-ago="${esc(S.updatedAt || '')}">${S.updatedAt ? agoText(S.updatedAt) : '—'}</span>`}</span>
  </footer>`;
  document.title = (waiting ? L.tabWait + ' — ' : '') + (S.title ? `${S.title} — AI Design` : 'AI Design');
  if (!booted) {
    booted = true;
    app.classList.add('boot');
    setTimeout(() => app.classList.remove('boot'), 1400);
  }
  fitFrames();
  app.querySelectorAll('iframe[data-watch]').forEach(f => watchFrame(f, t0));
  tick();
  showLink();
  // Открытый лайтбокс не перезагружаем на каждом событии: превью внутри живое.
  if (LB.open && !lbItems().length) lbClose();
  if (!pulling) pollState();
}

// ——— вкладка «Примеры работ»: examples/INDEX.json через сервер ———
let EXAMPLES = null;          // null — не грузили, 'loading', [] — пусто, [..] — есть
function loadExamples(){
  if (!SERVED || EXAMPLES === 'loading') return;
  EXAMPLES = 'loading';
  fetch('examples/INDEX.json?t=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : [])
    .then(d => { EXAMPLES = Array.isArray(d) ? d.filter(x => x && typeof x === 'object') : []; })
    .catch(() => { EXAMPLES = []; })
    .then(() => { if (UI.tab === 'examples') render(CUR.lang); });
}
const exSrc = x => {
  const f = String(x.file || (x.id ? x.id + '/index.html' : ''));
  if (!f) return '';
  const p = f.startsWith('examples/') ? f : 'examples/' + f;
  return p.split('/').map(encodeURIComponent).join('/');
};
function examplesCard(L){
  const head = `<div class="whead"><h3 class="wt">${L.exHead}</h3>${Array.isArray(EXAMPLES) && EXAMPLES.length ? `<span>${EXAMPLES.length}</span>` : ''}</div><p class="bsub">${L.exSub}</p>`;
  if (!SERVED) return `<section class="card w">${head}<div class="empty" style="margin-top:18px">${ic('alert','m')}<span>${L.exFile}</span></div></section>`;
  if (EXAMPLES === null) loadExamples();
  if (!Array.isArray(EXAMPLES)) return `<section class="card w">${head}<p class="muted" style="margin-top:18px">${L.exLoading}</p></section>`;
  if (!EXAMPLES.length) return `<section class="card w">${head}<div class="empty" style="margin-top:18px">${ic('image','m')}<span>${L.exEmpty}</span></div></section>`;
  const items = EXAMPLES.map(x => ({src: exSrc(x), title: x.title || x.id || '', note: [x.style].concat(x.techniques || []).filter(Boolean).join(' · '),
    label: '', sub: L.exHead}));
  SETS.ex = items;
  return `<section class="card w">${head}<div class="pvgrid">${EXAMPLES.map((x, i) => `<div class="pv">${pvButton(items[i], 'ex', i, '')}
    <h4>${esc(x.title || x.id || '')}</h4>${x.style ? `<p>${esc(x.style)}</p>` : ''}${(x.techniques || []).length
      ? `<div class="tags">${x.techniques.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}${pvOpen(items[i])}</div>`).join('')}</div></section>`;
}

// ——— лайтбокс: клик по превью → весь экран, 1280/390, Esc, ← → ———
const LB = {open: false, key: null, i: 0, w: BASE_W, back: null};
function lbItems(){ return SETS[LB.key] || []; }
function lbOpen(key, i, from){
  if (!(SETS[key] || []).length) return;
  LB.open = true; LB.key = key; LB.i = i; LB.back = from || document.activeElement;
  lbShow();
  const c = document.querySelector('#lb .close');
  if (c) c.focus();
}
function lbClose(){
  const el = document.getElementById('lb');
  LB.open = false;
  el.hidden = true;
  el.innerHTML = '';
  document.body.style.overflow = '';
  const back = LB.back && document.contains(LB.back) ? LB.back
    : document.querySelector(`#app [data-lb="${LB.key}"][data-i="${LB.i}"]`);
  if (back) back.focus();
}
function lbGo(d){
  const n = lbItems().length;
  if (n < 2) return;
  LB.i = (LB.i + d + n) % n;
  lbShow();
}
function lbShow(){
  const L = CUR, items = lbItems(), el = document.getElementById('lb');
  if (!items.length) { lbClose(); return; }
  LB.i = Math.min(LB.i, items.length - 1);
  const it = items[LB.i], many = items.length > 1;
  const keepFocus = el.contains(document.activeElement) ? document.activeElement.dataset.lbAct : null;
  // Снимок своей ширины лежит под живой страницей: виден, пока она грузится и если её не пустили.
  // Панель открыта файлом: живую страницу не показать, но снимок с диска браузер покажет и так.
  const shot = it.img ? '' : LB.w === PHONE_W ? it.shotPhone : it.shot;
  const live = it.src && !it.img && SERVED;
  const body = !it.src ? `<div class="lb-note">${esc(L.optWait)}</div>`
    : it.img ? `<img src="${esc(it.src)}" alt="${esc(it.title || '')}">`
    : !SERVED && shot ? `<img src="${esc(shot)}" alt="${esc(it.title || '')}" data-shot>`
    : !SERVED ? `<div class="lb-note">${esc(L.noFile)}</div>`
    : `${shot ? `<img class="lb-shot" src="${esc(shot)}" alt="${esc(it.title || '')}" data-shot>` : ''}<div class="lb-wait" role="status">${esc(L.lbLoading)}</div><iframe src="${esc(it.src)}" title="${esc(it.title || '')}" sandbox="allow-scripts" data-watch></iframe>`;
  const t0 = nowMs();
  el.innerHTML = `<div class="lb-bar">
      <p class="lb-title" id="lb-title"><small>${esc(it.sub || '')}${many ? ' · ' + L.lbOf(LB.i + 1, items.length) : ''}</small>${it.label ? esc(it.label) + ' — ' : ''}${esc(it.title || '')}</p>
      ${it.img ? '' : `<div class="seg" role="group" aria-label="${L.lbDesktop} / ${L.lbPhone}">
        <button type="button" data-lb-act="w1280" aria-pressed="${LB.w === BASE_W}">${L.lbDesktop}</button>
        <button type="button" data-lb-act="w390" aria-pressed="${LB.w === PHONE_W}">${L.lbPhone}</button></div>`}
      <button type="button" class="nav" data-lb-act="prev" aria-label="${L.lbPrev}"${many ? '' : ' disabled'}>${ic('left')}</button>
      <button type="button" class="nav" data-lb-act="next" aria-label="${L.lbNext}"${many ? '' : ' disabled'}>${ic('chev')}</button>
      ${live ? openLink(it.src, `${ic('eye')}<span>${esc(L.openTab)}</span>`, 'open') : ''}
      <button type="button" class="close" data-lb-act="close" aria-label="${L.lbClose}">${ic('x')}<span>${L.lbClose}</span></button>
    </div>
    <div class="lb-stage"><div class="lb-box${shot ? ' has-shot' : ''}">${body}</div></div>
    ${!SERVED && shot ? `<div class="lb-note">${esc(L.lbFileShot)}</div>` : ''}
    ${it.note ? `<div class="lb-note">${esc(it.note)}</div>` : ''}`;
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  lbFit();
  lbWatch(el, it.src, t0);
  // Превью в песочнице без allow-same-origin: его скрипты не дотянутся до панели,
  // а панель — до его окна. Esc и стрелки работают, пока фокус не внутри превью.
  if (keepFocus) { const b = el.querySelector(`[data-lb-act="${keepFocus}"]`); if (b) b.focus(); }
}
// Пока превью грузится, белая рамка выглядела пустой, а погасший сервер или пропавший файл
// оставляли её пустой навсегда. Теперь до загрузки видна строка «загружается», а адрес
// проверяется тем же сервером: не ответил или 404 — в рамке сказано, что делать.
// Содержимое превью панель не читает: песочница без allow-same-origin остаётся.
let lbSeq = 0;
function lbWatch(el, src, t0){
  const box = el.querySelector('.lb-box'), f = box && box.querySelector('iframe'), w = box && box.querySelector('.lb-wait');
  if (!f || !w) return;
  const seq = ++lbSeq, L = CUR;
  // Отказ — всегда со ссылкой на сам HTML: верхним окном вкладка покажет превью, даже если рамку не пустили.
  const fail = text => {
    if (seq !== lbSeq) return;
    box.classList.remove('loaded'); box.classList.add('fail'); f.hidden = true; w.classList.add('fail');
    w.innerHTML = `${esc(text)} ${openLink(src, `${esc(L.openTab)} <span aria-hidden="true">↗</span>`, 'lb-open-in')}`;
  };
  f.onLive = () => { if (seq === lbSeq && !w.classList.contains('fail')) box.classList.add('loaded'); };
  f.onFail = v => fail(box.classList.contains('has-shot') ? L.lbShotOnly : v === 'missing' ? L.lbMissing : L.pvBlocked);
  watchFrame(f, t0, true);
  if (typeof fetch !== 'function') return;
  fetch(src, {method: 'HEAD', cache: 'no-store'})
    .then(r => { if (!r.ok) fail(r.status === 404 ? L.lbMissing : L.lbDown); })
    .catch(() => fail(L.lbDown));
}

// ——— дошло ли превью до рамки ———
// Встроенный браузер приложения может не пускать страницу в iframe панели (ERR_BLOCKED_BY_CLIENT):
// событие load всё равно приходит, а внутри — пусто. Песочница без allow-same-origin не даёт
// заглянуть внутрь, поэтому панель смотрит запись Resource Timing загрузки рамки: наблюдатель
// получает её, даже когда общий буфер записей уже полон от опроса state.js.
const nowMs = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
const NAV = {};                // адрес превью → последняя запись загрузки рамки
const FRAMES = {};             // адрес превью → 'blocked' | 'missing': карточка сразу рисует отказ, без мигания
try {
  new PerformanceObserver(list => list.getEntries().forEach(e => {
    if (e.initiatorType !== 'iframe') return;
    NAV[e.name] = e;
    document.querySelectorAll('iframe[data-watch]').forEach(f => { if (f.src === e.name) settleFrame(f); });
  })).observe({type: 'resource', buffered: true});
} catch (err) {}
function watchFrame(f, t0, fresh){
  f.dataset.t0 = String((t0 || 0) - 1);
  const known = FRAMES[f.src];
  if (!fresh && (known === 'blocked' || known === 'missing')) { frameFailed(f, known); return; }
  f.addEventListener('load', () => { f.dataset.loaded = '1'; setTimeout(() => settleFrame(f), 150); });
}
function settleFrame(f){
  if (!f.isConnected || f.dataset.failed) return;
  const e = NAV[f.src];
  const v = frameVerdict(e && e.startTime >= +f.dataset.t0 ? e : null);
  if (v === 'blocked' || v === 'missing') { FRAMES[f.src] = v; frameFailed(f, v); }
  else if (f.dataset.loaded) { delete FRAMES[f.src]; frameLive(f); }
}
function frameLive(f){
  if (f.onLive) { f.onLive(); return; }
  const box = f.closest('.frame');
  if (box) box.classList.add('live');
}
function frameFailed(f, v){
  if (f.dataset.failed) return;
  f.dataset.failed = v;
  if (f.onFail) { f.onFail(v); return; }
  const box = f.closest('.frame'), ph = box && box.querySelector('.ph');
  f.remove();
  if (box) box.classList.add('fail');
  if (ph) ph.textContent = v === 'missing' ? CUR.lbMissing : CUR.pvBlocked;
}
// Снимок не загрузился — в карточке строка и ссылка под ней; в окне — живая страница или отказ.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || !img.matches || !img.matches('img[data-shot]')) return;
  const card = img.closest('.frame'), box = img.closest('.lb-box');
  img.remove();
  if (card) { card.classList.add('fail'); const ph = card.querySelector('.ph'); if (ph) ph.textContent = SERVED ? CUR.pvBlocked : CUR.noFile; }
  if (box && !SERVED) { box.innerHTML = `<div class="lb-wait">${esc(CUR.noFile)}</div>`; return; }
  if (box) {
    box.classList.remove('has-shot');
    const f = box.querySelector('iframe');
    if (f && f.dataset.failed) { const v = f.dataset.failed; delete f.dataset.failed; frameFailed(f, v); }
  }
}, true);
// 1280 — ширина компьютера: если экран уже, страница уменьшается целиком; 390 — телефон как есть.
function lbFit(){
  const el = document.getElementById('lb');
  const stage = el.querySelector('.lb-stage'), box = el.querySelector('.lb-box'), f = box && box.querySelector('iframe');
  if (!stage || !box) return;
  if (!f) { box.style.width = ''; box.style.height = ''; return; }
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - 32;
  const k = Math.min(1, aw / LB.w);
  const h = Math.max(200, ah);
  box.style.width = Math.round(LB.w * k) + 'px';
  box.style.height = Math.round(h) + 'px';
  f.style.width = LB.w + 'px';
  f.style.height = Math.round(h / k) + 'px';
  f.style.transform = k < 1 ? `scale(${k})` : '';
}
function lbKey(e){
  if (!LB.open) return;
  if (e.key === 'Escape') { e.preventDefault(); lbClose(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); lbGo(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); lbGo(1); }
  else if (e.key === 'Tab') {
    const f = Array.from(document.querySelectorAll('#lb button:not([disabled]), #lb a[href]'));
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
}
document.addEventListener('keydown', lbKey);
document.getElementById('lb').addEventListener('click', e => {
  const b = e.target.closest('[data-lb-act]');
  if (!b) { if (e.target.classList.contains('lb-stage')) lbClose(); return; }
  const a = b.dataset.lbAct;
  if (a === 'close') lbClose();
  else if (a === 'prev') lbGo(-1);
  else if (a === 'next') lbGo(1);
  else if (a === 'w1280' || a === 'w390') { LB.w = a === 'w390' ? PHONE_W : BASE_W; lbShow(); }
});

// Один обработчик на всё: #app переписывается целиком на каждом событии прогона.
document.getElementById('app').addEventListener('click', e => {
  const z = e.target.closest('[data-lb]');
  if (z) { lbOpen(z.dataset.lb, +z.dataset.i || 0, z); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-refresh')) refreshNow(b);
  else if (b.dataset.tab) {
    UI.tab = b.dataset.tab;
    try { localStorage.setItem('aidesign-tab', UI.tab); } catch(err) {}
    render(CUR.lang);
    const t = document.querySelector(`#app [data-tab="${UI.tab}"]`);
    if (t) t.focus();
  }
});
document.getElementById('app').addEventListener('change', e => {
  const sel = e.target.closest('select[data-pref]');
  if (!sel) return;
  if (sel.dataset.pref === 'lang') {
    try { localStorage.setItem('aidesign-lang', sel.value); } catch(err) {}
    render(sel.value);
  } else if (sel.dataset.pref === 'theme') {
    const t = sel.value === 'system' ? null : sel.value;
    try { t ? localStorage.setItem('aidesign-theme', t) : localStorage.removeItem('aidesign-theme'); } catch(err) {}
    applyTheme(t);
  }
});
document.getElementById('app').addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.matches && d.matches('details[data-key]')) UI.open[d.dataset.key] = d.open;
}, true);
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { fitFrames(); if (LB.open) lbFit(); }, 60); });

let savedLang = 'ru';
try {
  savedLang = localStorage.getItem('aidesign-lang') || ((navigator.language || '').startsWith('ru') ? 'ru' : 'en');
  UI.tab = localStorage.getItem('aidesign-tab') === 'examples' ? 'examples' : 'run';
} catch(e) {}
applyTheme(storedTheme());

function bootFail(why){
  const app = document.getElementById('app');
  if (!app) return;
  const L = I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'];
  app.innerHTML = `<header class="top">${BRAND(L.workshopLink)}</header>
    ${SERVED ? '' : `<div class="notice" role="status">${L.fileMode}</div>`}
    <section class="card"><h3 class="wt">${L.boot}</h3><p class="muted" style="margin-top:10px">${why}</p>
    <p class="muted" style="margin-top:10px">${L.bootHelp}</p></section>`;
}

if (typeof STATE === 'undefined' || !STATE || typeof STATE !== 'object') {
  bootFail(I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'].bootWhy);
  pollState();
} else {
  try {
    render(I18N[savedLang] ? savedLang : 'ru');
    lastStamp = stampOf(STATE);
  } catch (e) {
    bootFail(esc(String(e && e.message || e)));
    pollState();
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); refreshNow(); } });
window.addEventListener('pageshow', e => { if (e.persisted) { tick(); refreshNow(); } });
</script>
</body>
</html>
